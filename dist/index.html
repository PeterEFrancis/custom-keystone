<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fafafa" />
  <meta name="description" content="Open an image or PDF, shape its perspective, and zoom and scroll inside the frame." />
  <title>Keystone — shape your view</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%232563eb' d='M5 8 27 3 24 28 8 25Z'/%3E%3Cpath fill='white' d='m10 12 12-3-1 13-10-1Z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="header"><a class="brand" href="./" aria-label="Keystone home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 6 16-3-2 18-12-2Z"/></svg>keystone<span> / </span><span>perspective viewer</span></a><span class="top-hint">Your files stay on your device</span></header>
  <main id="stage" aria-label="Perspective workspace">
    <div id="frame" class="frame"><div id="viewport" class="viewport" tabindex="0" aria-label="Document. Scroll to move through the document."><div id="pages" class="pages"></div><button id="empty" class="empty"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="5" width="22" height="22" rx="4"/><path d="M16 10v12m-6-6h12"/></svg><strong>Open an image or PDF</strong><span>Click here or drop a file</span></button></div></div>
    <svg id="outline" class="outline" aria-hidden="true"><polygon id="polygon"/></svg>
    <div id="handles"></div>
  </main>
  <p id="notice" class="notice" role="status" aria-live="polite"></p>
  <footer class="footer"><p id="hint" class="hint">Drag the corners to shape your frame</p><div class="toolbar" role="toolbar" aria-label="Document controls"><button id="open" class="file-button" title="Open image or PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v2M3 7h15a2 2 0 0 1 2 2l-2 10H3L1 9a2 2 0 0 1 2-2Z"/></svg><span id="file-name">Open file</span></button><span class="divider"></span><button id="zoom-out" class="icon-button" aria-label="Zoom out" title="Zoom out" disabled>−</button><output id="zoom-value" aria-label="Zoom level">100%</output><button id="zoom-in" class="icon-button" aria-label="Zoom in" title="Zoom in" disabled>+</button><button id="fit" class="text-button" disabled>Fit</button><span class="divider"></span><button id="reset" class="reset-button" title="Reset the four corners"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg><span>Reset frame</span></button></div><p class="key-hint">Scroll to move <span>·</span> Ctrl / ⌘ + scroll to zoom</p></footer>
  <input id="file-input" type="file" accept="application/pdf,image/*" hidden />
  <script type="module" src="./app.js"></script>
</body>
</html>
